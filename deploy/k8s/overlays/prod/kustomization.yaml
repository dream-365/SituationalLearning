apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: situlearn

resources:
  - ../../base

images:
  - name: situlearn-web
    newName: ghcr.io/dream-365/situlearn-web
    newTag: "0.4.0"

patches:
  - target:
      kind: Ingress
      name: situlearn
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: situlearn.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: situlearn.example.com
  - target:
      kind: ConfigMap
      name: situlearn-config
    patch: |-
      - op: replace
        path: /data/SITE_BASE_URL
        value: https://situlearn.example.com
