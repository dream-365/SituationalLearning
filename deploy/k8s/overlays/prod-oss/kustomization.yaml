# Template overlay: replace host, OSS_BUCKET and OSS_ENDPOINT with
# local values before applying. Keep real infrastructure values out of Git.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: situlearn

resources:
  - ../../base

images:
  - name: situlearn-web
    newName: registry.cn-hangzhou.aliyuncs.com/afx/situlearn-web
    newTag: "0.4.1"

patches:
  - target:
      kind: Ingress
      name: situlearn
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: situlearn.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: situlearn.example.com
      - op: replace
        path: /spec/tls/0/secretName
        value: situlearn-tls
  - target:
      kind: ConfigMap
      name: situlearn-config
    patch: |-
      - op: replace
        path: /data/SITE_BASE_URL
        value: https://situlearn.example.com
      - op: add
        path: /data/OSS_BUCKET
        value: situlearn-reports
      - op: add
        path: /data/OSS_ENDPOINT
        value: oss-<region>-internal.aliyuncs.com
      - op: add
        path: /data/OSS_PREFIX
        value: situlearn/
  - target:
      kind: Deployment
      name: situlearn
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: registry-credentials
  - target:
      kind: CronJob
      name: situlearn-backup
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/imagePullSecrets
        value:
          - name: registry-credentials
