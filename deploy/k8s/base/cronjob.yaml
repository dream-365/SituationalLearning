apiVersion: batch/v1
kind: CronJob
metadata:
  name: situlearn-backup
  labels:
    app.kubernetes.io/name: situlearn
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: backup
              image: situlearn-web:0.4.1
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - situlearn.web.backup
              args:
                - --data-dir
                - /data
                - --keep-days
                - "30"
              env:
                - name: SITULEARN_BACKUP_DIR
                  value: /backup
              envFrom:
                - configMapRef:
                    name: situlearn-config
                - secretRef:
                    name: situlearn-secrets
                    optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: situlearn-data
            - name: backup
              persistentVolumeClaim:
                claimName: situlearn-backup
            - name: tmp
              emptyDir: {}
