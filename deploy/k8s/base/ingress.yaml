apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: situlearn
  labels:
    app.kubernetes.io/name: situlearn
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - situlearn.example.com
      secretName: situlearn-tls
  rules:
    - host: situlearn.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: situlearn
                port:
                  name: http
