apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: situlearn
  labels:
    app.kubernetes.io/name: situlearn
spec:
  podSelector:
    matchLabels:
      app: situlearn
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
