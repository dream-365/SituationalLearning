services:
  web:
    image: ghcr.io/dream-365/situlearn-web:0.4.2
    container_name: situlearn-web
    restart: unless-stopped
    ports:
      - "${SITULEARN_PORT:-8080}:8000"
    env_file:
      - .env
    environment:
      SITULEARN_DATA_DIR: /data
      SITULEARN_BACKUP_DIR: /backup
    volumes:
      - situlearn-data:/data
      - situlearn-backup:/backup
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  situlearn-data:
  situlearn-backup:
