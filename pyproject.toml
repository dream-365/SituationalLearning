[project]
name = "situlearn"
version = "0.1.2"
description = "SituLearn (情景学习): turn documentary subtitles into an offline, listenable study report."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain",
  "langchain-deepseek",
  "pydantic>=2",
  "jinja2>=3",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
situlearn = "situlearn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/situlearn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
